name: learn CICD

on: [push]


jobs:

    build:
         runs-on: ubuntu-latest

         steps:
             -  name: 拉取代码
                uses: actions/checkout@v4

             - name: setup python
               uses: actions/setup-python@v5
               with:
                 python-version: "3.13"

             - name: install dependencies
               run: pip install pytest requests

             - name: 执行测试
               run: pytest
         