name: for_learn_github_actions

on: 
    push:
    workflow_dispatch:

jobs: 
    
    test:
        runs-on: ubuntu-latest

        steps:
            - name: 拉取代码
              uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                 python-version: '3.12'

            - name: install dependencies
              run: pip install  -r requirements.txt

            -  name: 执行测试
               run: pytest

